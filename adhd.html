<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #fff;
    --dim: rgba(255,255,255,.62);
    --line: rgba(255,255,255,.16);
    --glass: rgba(0,0,0,.5);
    --tile: rgba(255,255,255,.08);
  }

  html, body { height: 100%; background: #e9e9e9; color: var(--white); }
  body { font-family: "IBM Plex Mono", "DejaVu Sans Mono", Consolas, monospace; overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid #000; outline-offset: 3px; }

  /* ---------- background ---------- */
  #bg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: -1;
    filter: brightness(.94);
  }

  /* ---------- click to enter ---------- */
  #enter {
    position: fixed; inset: 0; z-index: 50;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .7s ease;
  }
  #enter span { font-size: 34px; animation: beat 2.4s ease-in-out infinite; }
  #enter.gone { opacity: 0; pointer-events: none; }
  @keyframes beat { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }

  /* ---------- top corners ---------- */
  .home {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    display: block; width: 56px; height: 56px;
    transition: transform .15s;
  }
  .home img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .home:hover { transform: scale(1.06); }

  .vol {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: rgba(0,0,0,.45);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .vol svg { width: 16px; height: 16px; fill: #fff; flex: none; }
  .vol input { width: 90px; accent-color: #fff; cursor: pointer; }

  /* ---------- layout ---------- */
  main {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px;
    padding: 80px 16px 48px;
  }

  /* ---------- card ---------- */
  .card {
    width: 100%; max-width: 430px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 22px 20px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    text-align: center;
    opacity: 0;
    transition: transform .25s ease-out;
  }
  .card.show { opacity: 1; transition: transform .25s ease-out, opacity .9s ease; }

  .avatar {
    width: 104px; height: 104px; margin: 0 auto 12px;
    border-radius: 50%; object-fit: cover; display: block;
    border: 2px solid rgba(255,255,255,.85);
    background: #1a1a1a;
  }
  h1 { font-size: 27px; font-weight: 500; text-shadow: 0 0 14px rgba(255,255,255,.55); }

  /* ---------- badges ---------- */
  .badges {
    display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px;
    margin-top: 10px; padding: 4px 8px;
    background: var(--tile); border: 1px solid var(--line); border-radius: 9px;
  }
  .badge { width: 26px; height: 26px; display: grid; place-items: center; cursor: default; }
  .badge svg { width: 16px; height: 16px; filter: drop-shadow(0 0 4px rgba(255,255,255,.5)); }

  /* shared tooltip */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translate(-50%, 4px);
    background: var(--white); color: #000;
    font-size: 11px; white-space: nowrap;
    padding: 3px 8px; border-radius: 5px;
    opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .15s;
    z-index: 5;
  }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }

  .bio { margin-top: 12px; font-size: 13px; color: var(--dim); }
  .bio:empty { display: none; }

  /* ---------- icon links ---------- */
  .icons { margin-top: 18px; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
  .icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--tile); border: 1px solid var(--line);
    transition: background .15s, transform .15s, box-shadow .15s;
  }
  .icon svg { width: 21px; height: 21px; fill: var(--white); filter: drop-shadow(0 0 5px rgba(255,255,255,.45)); }
  .icon:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); box-shadow: 0 0 16px rgba(255,255,255,.2); }

  /* ---------- panels ---------- */
  .panel {
    margin-top: 12px;
    background: var(--tile); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px;
    display: flex; align-items: center; gap: 12px;
    text-align: left;
  }

  .dc-pfp { position: relative; width: 44px; height: 44px; flex: none; }
  .dc-pfp img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1a1a1a; }
  .dot {
    position: absolute; right: -1px; bottom: -1px;
    width: 13px; height: 13px; border-radius: 50%;
    border: 3px solid #2a2a2a; background: #747f8d;
  }
  .dot.online { background: #23a55a; }
  .dot.idle   { background: #f0b232; }
  .dot.dnd    { background: #f23f43; }
  .dc-text { min-width: 0; flex: 1; }
  .dc-name { font-size: 14px; }
  .dc-act  { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cover { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: #1a1a1a; }
  .pl-mid { flex: 1; min-width: 0; }
  .pl-title  { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-artist { font-size: 11px; color: var(--dim); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 10px; color: var(--dim); }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; cursor: pointer; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--white); border-radius: 2px; box-shadow: 0 0 8px rgba(255,255,255,.6); }
  .pl-btn { width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--white); display: grid; place-items: center; }
  .pl-btn svg { width: 16px; height: 16px; fill: #000; }

  /* ---------- lyrics (left side, on the background) ---------- */
  .lyrics {
    position: fixed;
    left: clamp(20px, 4vw, 72px);
    top: 50%;
    transform: translateY(-50%);
    width: clamp(220px, 24vw, 360px);
    height: 230px;
    overflow: hidden;
    opacity: 0;
    transition: opacity .9s ease;
    -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
            mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
  }
  .lyrics.show { opacity: 1; }
  .lyrics[hidden] { display: none; }
  .lyrics ul { list-style: none; transition: transform .55s cubic-bezier(.22,.61,.36,1); }
  .lyrics li {
    width: 93%;                          /* room for the 1.06x zoom */
    padding: 6px 4px;
    font-size: 17px; line-height: 1.35;
    text-align: left;
    color: rgba(0,0,0,.62);
    transform-origin: left center;
    transition: color .35s, text-shadow .35s, transform .35s;
  }
  .lyrics li.on {
    color: #fff;
    transform: scale(1.06);
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000,
       0 -1px 0 #000, 0 1px 0 #000, -1px 0 0 #000, 1px 0 0 #000,
       0 0 10px rgba(255,255,255,.95), 0 0 22px rgba(255,255,255,.7);
  }

  /* smaller screens: lyrics sit under the card instead */
  @media (max-width: 1100px) {
    .lyrics {
      position: static; transform: none;
      width: 100%; max-width: 430px; height: 170px;
    }
  }
  @media (max-width: 420px) {
    .card { padding: 26px 14px 16px; }
    .icon { width: 42px; height: 42px; }
    .vol input { width: 64px; }
    .home { width: 46px; height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

const BADGES = {
  crown: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 18h18v2.5H3zM2.5 6.5l5 4.2L12 3.5l4.5 7.2 5-4.2-2.2 10H4.7z"/></svg>',
  bolt:  '<svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.8h-6.6z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21.3s-7.6-4.6-9.7-9.4C.8 8.4 3 4.6 6.7 4.6c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.9 3.8 4.4 7.3-2.1 4.8-9.7 9.4-9.7 9.4z"/></svg>',
  code:  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>'
};

const $ = id => document.getElementById(id);
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const safeImg = (img, src) => { img.addEventListener("error", () => img.src = BLANK, { once: true }); img.src = src; };

/* ---------- profile ---------- */
$("name").textContent = CONFIG.name;
$("bio").textContent = CONFIG.bio;
safeImg($("avatar"), CONFIG.avatar);
safeImg($("dcPfp"), CONFIG.avatar);

if (!CONFIG.badges.length) $("badges").remove();
CONFIG.badges.forEach(b => {
  const el = document.createElement("span");
  el.className = "badge"; el.tabIndex = 0;
  el.dataset.tip = b.label; el.setAttribute("aria-label", b.label);
  el.innerHTML = BADGES[b.icon] || "";
  $("badges").appendChild(el);
});

CONFIG.links.forEach(l => {
  const a = document.createElement("a");
  a.className = "icon"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.dataset.tip = l.tip; a.setAttribute("aria-label", `${l.icon} ${l.tip}`);
  a.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ICONS[l.icon] || ""}"/></svg>`;
  $("icons").appendChild(a);
});

/* ---------- background: make sure it plays ---------- */
const bg = $("bg");
bg.muted = true;
const kick = () => bg.play().catch(() => {});
bg.addEventListener("canplay", kick, { once: true });
kick();

/* ---------- discord presence (Lanyard) ---------- */
$("dcName").textContent = CONFIG.links.find(l => l.icon === "discord")?.tip || "discord";

async function presence() {
  try {
    const r = await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordId}`);
    const j = await r.json();
    if (!j.success) return;
    const d = j.data, u = d.discord_user;
    $("dcName").textContent = u.global_name || u.username;
    $("dcDot").className = `dot ${d.discord_status}`;

    const custom = d.activities.find(a => a.type === 4);
    const game   = d.activities.find(a => a.type === 0);
    let text = d.discord_status;
    if (d.listening_to_spotify && d.spotify) text = `listening to ${d.spotify.song}`;
    else if (game) text = `playing ${game.name}`;
    else if (custom && custom.state) text = custom.state;
    $("dcAct").textContent = text;
  } catch (e) { /* keep offline look */ }
}
presence();
setInterval(presence, 30000);

/* ---------- player ---------- */
const audio = $("audio");
const S = CONFIG.song;
audio.src = S.src;
audio.volume = CONFIG.volume;
$("vol").value = CONFIG.volume;
$("plTitle").textContent = S.title;
$("plArtist").textContent = S.artist;
safeImg($("cover"), S.cover || CONFIG.avatar);

const fmt = s => isNaN(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
const VOL_ON  = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>';
const VOL_OFF = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';
const setIcon = () => {
  $("playIcon").innerHTML = audio.paused ? PLAY : PAUSE;
  $("playBtn").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
};

$("playBtn").onclick = () => audio.paused ? audio.play() : audio.pause();
$("vol").addEventListener("input", e => {
  const v = +e.target.value;
  audio.volume = v;
  audio.muted = v === 0;
  $("volIcon").innerHTML = v === 0 ? VOL_OFF : VOL_ON;
});
audio.onplay = audio.onpause = setIcon;
audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
audio.ontimeupdate = () => {
  $("cur").textContent = fmt(audio.currentTime);
  $("fill").style.width = (audio.currentTime / audio.duration * 100 || 0) + "%";
  syncLyrics();
};
$("bar").onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
};

/* ---------- synced lyrics ---------- */
let lines = [], current = -1;

function parseLRC(text) {
  const out = [];
  text.split(/\r?\n/).forEach(row => {
    const stamps = [...row.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const words = row.replace(/\[[^\]]*\]/g, "").trim();
    stamps.forEach(m => out.push({ t: +m[1] * 60 + +m[2], text: words || "♪" }));
  });
  return out.sort((a, b) => a.t - b.t);
}

async function loadLyrics() {
  const tries = [];
  if (S.lrcFile) tries.push(() => fetch(S.lrcFile).then(r => r.ok ? r.text() : null));
  if (S.lrclibId) tries.push(() => fetch(`https://lrclib.net/api/get/${S.lrclibId}`).then(r => r.ok ? r.json() : null).then(j => j && j.syncedLyrics));
  tries.push(() => fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(S.artist)}&track_name=${encodeURIComponent(S.title)}`)
    .then(r => r.ok ? r.json() : null).then(j => j && j.syncedLyrics));

  for (const t of tries) {
    try {
      const lrc = await t();
      if (lrc) { lines = parseLRC(lrc); break; }
    } catch (e) { /* try next source */ }
  }
  if (!lines.length) return;

  const ul = $("lyricList");
  lines.forEach(l => {
    const li = document.createElement("li");
    li.textContent = l.text;
    ul.appendChild(li);
  });
  $("lyrics").hidden = false;
  centerLine(0);
}

function centerLine(i) {
  const box = $("lyrics"), ul = $("lyricList"), li = ul.children[Math.max(i, 0)];
  if (!li) return;
  const y = box.clientHeight / 2 - (li.offsetTop + li.offsetHeight / 2);
  ul.style.transform = `translateY(${y}px)`;
}

function syncLyrics() {
  if (!lines.length) return;
  const t = audio.currentTime + 0.15;
  let i = -1;
  for (let k = 0; k < lines.length; k++) { if (lines[k].t <= t) i = k; else break; }
  if (i === current) return;
  const items = $("lyricList").children;
  if (items[current]) items[current].classList.remove("on");
  if (items[i]) items[i].classList.add("on");
  current = i;
  centerLine(i);
}
addEventListener("resize", () => centerLine(current));

loadLyrics();

/* ---------- card tilt ---------- */
const card = $("card");
if (!reduce && matchMedia("(hover: hover)").matches) {
  document.addEventListener("mousemove", e => {
    const x = (e.clientX / innerWidth - .5) * 7;
    const y = (e.clientY / innerHeight - .5) * -7;
    card.style.transform = `perspective(1100px) rotateY(${x}deg) rotateX(${y}deg)`;
  });
}

/* ---------- enter ---------- */
function enter() {
  const gate = $("enter");
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone");
  card.classList.add("show");
  $("lyrics").classList.add("show");
  audio.play().catch(() => {});
  kick();
  setTimeout(() => gate.remove(), 800);
}
$("enter").addEventListener("click", enter);
$("enter").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
</script>
