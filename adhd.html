<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>adhd</title>
<meta name="description" content="isolate.icu/adhd">
<meta property="og:title" content="adhd">
<meta property="og:url" content="https://isolate.icu/adhd">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000;
    --white: #fff;
    --dim: #9a9a9a;
    --line: rgba(255,255,255,.18);
    --glass: rgba(0,0,0,.55);
  }

  html, body { height: 100%; background: var(--black); color: var(--white); }

  body {
    font-family: "IBM Plex Mono", "DejaVu Sans Mono", Consolas, monospace;
    overflow-x: hidden;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

  /* ---------- background ---------- */
  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: grayscale(1) brightness(.45);
  }
  .noise {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 100%);
  }

  /* ---------- click to enter ---------- */
  #enter {
    position: fixed; inset: 0; z-index: 50;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .6s ease;
  }
  #enter span { font-size: 15px; color: var(--dim); }
  #enter span::after { content: "_"; animation: blink 1s steps(1) infinite; }
  #enter.gone { opacity: 0; pointer-events: none; }

  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- home link ---------- */
  .home {
    position: fixed; top: 18px; left: 20px;
    font-size: 13px; color: var(--dim); text-decoration: none;
  }
  .home:hover { color: var(--white); }

  /* ---------- layout ---------- */
  main {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 72px 16px;
    perspective: 1000px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 26px 22px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    transform-style: preserve-3d;
    transition: transform .2s ease-out;
    opacity: 0;
  }
  .card.show { opacity: 1; transition: transform .2s ease-out, opacity .8s ease; }

  /* ---------- avatar ---------- */
  .avatar {
    position: relative;
    width: 108px; height: 108px;
    margin: 0 auto 14px;
  }
  .avatar img.pfp {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--white);
    background: #1a1a1a;
  }
  .avatar img.deco {
    position: absolute;
    inset: -18%;
    width: 136%; height: 136%;
    pointer-events: none;
  }

  h1 {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: .01em;
  }

  /* ---------- badges ---------- */
  .badges {
    display: inline-flex; flex-wrap: wrap; justify-content: center;
    gap: 4px;
    margin-top: 10px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .badge {
    position: relative;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    font-size: 14px;
    cursor: default;
  }
  .badge::after {
    content: attr(data-label);
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    background: var(--white); color: var(--black);
    font-size: 11px; white-space: nowrap;
    padding: 3px 7px; border-radius: 4px;
    opacity: 0; pointer-events: none;
    transition: opacity .12s;
  }
  .badge:hover::after, .badge:focus-visible::after { opacity: 1; }

  /* ---------- bio + meta ---------- */
  .bio {
    margin-top: 14px;
    min-height: 1.5em;
    font-size: 14px;
    line-height: 1.5;
  }
  .bio::after { content: "|"; color: var(--dim); animation: blink 1s steps(1) infinite; margin-left: 1px; }

  .meta {
    margin-top: 8px;
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12px;
    color: var(--dim);
  }
  .meta svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }

  /* ---------- links (white tiles, same as the home cards) ---------- */
  .links {
    margin-top: 22px;
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .link {
    display: flex; align-items: center; gap: 12px;
    background: var(--white); color: var(--black);
    text-decoration: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    text-align: left;
    width: 100%;
    transition: transform .12s ease;
  }
  .link:hover { transform: translateX(3px); }
  .link img, .link svg.ico { width: 18px; height: 18px; flex: none; }
  .link .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link .label small { color: #666; margin-left: 6px; }
  .link .end { font-size: 12px; color: #666; }

  /* ---------- music player ---------- */
  .player {
    margin-top: 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 6px 12px;
    text-align: left;
  }
  .cover {
    width: 52px; height: 52px; border-radius: 6px;
    object-fit: cover; background: #1a1a1a;
    grid-row: span 2;
  }
  .track { min-width: 0; align-self: end; }
  .track .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .a { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--dim); }
  .bar {
    flex: 1; height: 3px; background: var(--line); border-radius: 2px;
    cursor: pointer; position: relative;
  }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--white); border-radius: 2px; }

  .controls {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: center;
    gap: 18px;
    margin-top: 2px;
  }
  .controls button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
  .controls button svg { width: 16px; height: 16px; fill: var(--white); }
  .controls .play { background: var(--white); }
  .controls .play svg { fill: var(--black); }
  .vol { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
  .vol input { width: 70px; accent-color: var(--white); }

  /* ---------- footer stats ---------- */
  .stats {
    margin-top: 18px;
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--dim);
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translate(-50%, 20px);
    background: var(--white); color: var(--black);
    font-size: 13px; padding: 8px 14px; border-radius: 6px;
    opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 420px) {
    .card { padding: 28px 16px 18px; }
    .vol { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- background video (optional) — delete the tag or leave the file missing for plain black -->
<video id="bg" autoplay muted loop playsinline onerror="this.remove()">
  <source src="/assets/bg.mp4" type="video/mp4" onerror="document.getElementById('bg').remove()">
</video>
<div class="noise"></div>

<div id="enter" role="button" tabindex="0" aria-label="Enter"><span>click to enter</span></div>

<a class="home" href="/">isolate</a>

<main>
  <section class="card" id="card">
    <div class="avatar">
      <img class="pfp" id="pfp" alt="">
      <img class="deco" id="deco" alt="" hidden>
    </div>

    <h1 id="name"></h1>
    <div class="badges" id="badges"></div>
    <p class="bio" id="bio"></p>
    <div class="meta" id="meta"></div>

    <div class="links" id="links"></div>

    <div class="player" id="player">
      <img class="cover" id="cover" alt="">
      <div class="track">
        <div class="t" id="trackTitle"></div>
        <div class="a" id="trackArtist"></div>
      </div>
      <div class="bar-row">
        <span id="cur">00:00</span>
        <div class="bar" id="bar"><i id="fill"></i></div>
        <span id="dur">00:00</span>
      </div>
      <div class="controls">
        <button id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
        <button class="play" id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <label class="vol"><svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
          <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume"></label>
      </div>
    </div>

    <div class="stats">
      <span id="views"></span>
      <span id="uid"></span>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
/* =====================================================
   EDIT EVERYTHING HERE
   ===================================================== */
const CONFIG = {
  name: "adhd",
  tabTitle: "adhd",                       // types itself in the browser tab
  avatar: "/assets/avatar.png",
  decoration: "",                          // optional gif overlay, e.g. "/assets/deco.gif"
  bios: [                                  // cycles with a typing effect
    "nothing to see here",
    "isolate.icu"
  ],
  location: "",                            // leave "" to hide
  joined: "",                              // e.g. "2026" — leave "" to hide
  badges: [                                // icon = any emoji/symbol, label = tooltip
    { icon: "✦", label: "Owner" },
    { icon: "☾", label: "Night owl" },
    { icon: "⚡", label: "Early user" }
  ],
  // icon = a slug from simpleicons.org (discord, github, spotify, youtube, steam, telegram,
  // instagram, tiktok, x, twitch, kick, roblox...). Leave icon "" for a plain link icon.
  links: [
    { icon: "github",   label: "GitHub",   sub: "",            url: "https://github.com/yourname" },
    { icon: "telegram", label: "Telegram", sub: "",            url: "https://t.me/yourname" },
    { icon: "steam",    label: "Steam",    sub: "",            url: "https://steamcommunity.com/id/yourname" },
    { icon: "discord",  label: "Discord",  sub: "yourname",    copy: "yourname" }   // copy = click copies the text
  ],
  tracks: [
    { title: "track one", artist: "artist", src: "/assets/song1.mp3", cover: "/assets/cover1.jpg" },
    { title: "track two", artist: "artist", src: "/assets/song2.mp3", cover: "/assets/cover2.jpg" }
  ],
  volume: 0.35,
  views: 1337,                             // static number (real counting needs a backend)
  uid: 1
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const safeImg = img => img.addEventListener("error", () => { img.src = BLANK; }, { once: true });
safeImg($("pfp")); safeImg($("cover"));

/* ---------- render profile ---------- */
$("name").textContent = CONFIG.name;
$("pfp").src = CONFIG.avatar;
if (CONFIG.decoration) { $("deco").src = CONFIG.decoration; $("deco").hidden = false; }

const badgeBox = $("badges");
if (!CONFIG.badges.length) badgeBox.remove();
CONFIG.badges.forEach(b => {
  const el = document.createElement("span");
  el.className = "badge";
  el.tabIndex = 0;
  el.dataset.label = b.label;
  el.setAttribute("aria-label", b.label);
  el.textContent = b.icon;
  badgeBox.appendChild(el);
});

const pin = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const cal = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v2H4v18h16V4h-3V2h-2v2H9V2H7zm-1 8h12v10H6V10z"/></svg>';
if (CONFIG.location) $("meta").insertAdjacentHTML("beforeend", `<span>${pin}${CONFIG.location}</span>`);
if (CONFIG.joined)   $("meta").insertAdjacentHTML("beforeend", `<span>${cal}joined ${CONFIG.joined}</span>`);

const linkIco = '<svg class="ico" viewBox="0 0 24 24" fill="#000"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8 21a5 5 0 0 1-3.5-8.5l2-2a1 1 0 1 1 1.4 1.4l-2 2A3 3 0 0 0 10.1 18l2-2a1 1 0 0 1 1.4 1.4l-2 2A5 5 0 0 1 8 21zm9.5-7.1a1 1 0 0 1-.7-1.7l2-2a3 3 0 0 0-4.2-4.3l-2 2a1 1 0 0 1-1.4-1.4l2-2a5 5 0 0 1 7 7l-2 2a1 1 0 0 1-.7.4z"/></svg>';

CONFIG.links.forEach(l => {
  const el = document.createElement(l.copy ? "button" : "a");
  el.className = "link";
  if (!l.copy) { el.href = l.url; el.target = "_blank"; el.rel = "noopener"; }
  const ico = l.icon ? `<img src="https://cdn.simpleicons.org/${l.icon}/000000" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">` : linkIco;
  const sub = l.sub ? `<small>${l.sub}</small>` : "";
  el.innerHTML = `${ico}<span class="label">${l.label}${sub}</span><span class="end">${l.copy ? "copy" : "↗"}</span>`;
  if (l.copy) el.addEventListener("click", () => {
    navigator.clipboard.writeText(l.copy).then(() => toast(`copied ${l.copy}`));
  });
  $("links").appendChild(el);
});

$("views").textContent = `${CONFIG.views.toLocaleString()} views`;
$("uid").textContent = `uid ${CONFIG.uid}`;

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 1600);
}

/* ---------- typing bio ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function typeBio() {
  const el = $("bio");
  if (reduce || CONFIG.bios.length < 1) { el.textContent = CONFIG.bios[0] || ""; return; }
  let i = 0, c = 0, del = false;
  (function tick() {
    const s = CONFIG.bios[i];
    el.textContent = s.slice(0, c);
    if (!del && c < s.length) c++;
    else if (!del) { del = true; return setTimeout(tick, 2200); }
    else if (c > 0) c--;
    else { del = false; i = (i + 1) % CONFIG.bios.length; }
    setTimeout(tick, del ? 35 : 75);
  })();
}

/* ---------- typing tab title ---------- */
function typeTitle() {
  const s = CONFIG.tabTitle; let c = 1, dir = 1;
  setInterval(() => {
    document.title = s.slice(0, c) || "‎";
    c += dir;
    if (c >= s.length) dir = -1;
    if (c <= 1) dir = 1;
  }, 400);
}

/* ---------- music player ---------- */
const audio = $("audio");
let ti = 0;
audio.volume = $("vol").value = CONFIG.volume;
const fmt = s => isNaN(s) ? "00:00" : `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const PLAY  = '<path d="M8 5v14l11-7z"/>';
const PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

function load(i, autoplay) {
  ti = (i + CONFIG.tracks.length) % CONFIG.tracks.length;
  const t = CONFIG.tracks[ti];
  audio.src = t.src;
  $("trackTitle").textContent = t.title;
  $("trackArtist").textContent = t.artist;
  $("cover").src = t.cover || CONFIG.avatar;
  if (autoplay) audio.play().catch(() => {});
}
function setIcon() {
  $("playIcon").innerHTML = audio.paused ? PLAY : PAUSE;
  $("playBtn").setAttribute("aria-label", audio.paused ? "Play" : "Pause");
}

if (!CONFIG.tracks.length) $("player").remove();
else load(0, false);

$("playBtn").onclick = () => audio.paused ? audio.play() : audio.pause();
$("prev").onclick = () => load(ti - 1, true);
$("next").onclick = () => load(ti + 1, true);
$("vol").oninput = e => audio.volume = e.target.value;
audio.onplay = audio.onpause = setIcon;
audio.onended = () => load(ti + 1, true);
audio.ontimeupdate = () => {
  $("cur").textContent = fmt(audio.currentTime);
  $("fill").style.width = (audio.currentTime / audio.duration * 100 || 0) + "%";
};
audio.onloadedmetadata = () => $("dur").textContent = fmt(audio.duration);
$("bar").onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (audio.duration) audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
};

/* ---------- card tilt (desktop only) ---------- */
const card = $("card");
if (!reduce && matchMedia("(hover: hover)").matches) {
  document.addEventListener("mousemove", e => {
    const x = (e.clientX / innerWidth - .5) * 8;
    const y = (e.clientY / innerHeight - .5) * -8;
    card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
  });
}

/* ---------- click to enter ---------- */
function enter() {
  const gate = $("enter");
  if (gate.classList.contains("gone")) return;
  gate.classList.add("gone");
  card.classList.add("show");
  if (CONFIG.tracks.length) audio.play().catch(() => {});
  typeBio();
  typeTitle();
  setTimeout(() => gate.remove(), 700);
}
$("enter").addEventListener("click", enter);
$("enter").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") enter(); });
</script>
</body>
</html>
